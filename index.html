<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Numeric Data Sender</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(90%, 380px);
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .topbar label {
      font-size: 14px;
      font-weight: bold;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 25px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: #cbd5e1;
      border-radius: 25px;
      transition: 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 19px;
      height: 19px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .slider {
      background: #2563eb;
    }

    input:checked + .slider::before {
      transform: translateX(21px);
    }

    h2 {
      margin: 0 0 8px;
      text-align: center;
      color: #0f172a;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
    }

    #numberInput {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 22px;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
    }

    #numberInput:focus {
      border-color: #2563eb;
    }

    #sendButton {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #sendButton:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="topbar">
      <label id="modeLabel" for="autoMode">
        Manual Submit
      </label>

      <label class="switch">
        <input type="checkbox" id="autoMode">
        <span class="slider"></span>
      </label>
    </div>

    <h2>Numeric Sender</h2>

    <p class="subtitle">
      Enter a 6-digit numeric value
    </p>

    <form id="senderForm">
      <input
        type="text"
        id="numberInput"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        placeholder="000000"
        autocomplete="off"
        aria-label="Six digit numeric value"
        required
      >

      <button type="submit" id="sendButton">
        Send
      </button>
    </form>

    <div id="status" role="status" aria-live="polite">
      Ready
    </div>

    <p class="hint">
      Auto mode submits when six digits are entered.
    </p>

  </main>

  <script>
    const input = document.getElementById("numberInput");
    const autoMode = document.getElementById("autoMode");
    const modeLabel = document.getElementById("modeLabel");
    const form = document.getElementById("senderForm");
    const sendButton = document.getElementById("sendButton");
    const status = document.getElementById("status");

    // Use only for ordinary, non-sensitive numeric data.
    // Do not forward OTPs, passwords, or authentication codes.
    const ENDPOINT = "/api/numeric-data";

    let sending = false;
    let lastAutoValue = "";

    autoMode.addEventListener("change", () => {
      modeLabel.textContent = autoMode.checked
        ? "Auto Submit"
        : "Manual Submit";

      lastAutoValue = "";

      status.textContent = autoMode.checked
        ? "Auto mode enabled"
        : "Manual mode enabled";
    });

    input.addEventListener("input", () => {
      // Keep ASCII digits only.
      input.value = input.value.replace(/[^0-9]/g, "").slice(0, 6);

      if (input.value.length !== 6) {
        lastAutoValue = "";
        return;
      }

      if (
        autoMode.checked &&
        input.value !== lastAutoValue &&
        !sending
      ) {
        lastAutoValue = input.value;
        sendData();
      }
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!autoMode.checked) {
        sendData();
      }
    });

    async function sendData() {
      const value = input.value;

      if (!/^[0-9]{6}$/.test(value)) {
        status.textContent = "Enter exactly 6 digits.";
        return;
      }

      if (sending) return;

      sending = true;
      sendButton.disabled = true;
      status.textContent = "Sending...";

      try {
        const response = await fetch(ENDPOINT, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ value })
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        status.textContent = "Data sent successfully.";
        input.value = "";
        lastAutoValue = "";

      } catch (error) {
        status.textContent =
          "Send failed. Check your server connection.";

        console.error(error);

      } finally {
        sending = false;
        sendButton.disabled = false;
      }
    }
  </script>
</body>
</html>
